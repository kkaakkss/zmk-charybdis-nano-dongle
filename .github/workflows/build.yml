name: Build Nano35 firmware
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - run: python3 -m pip install PyYAML==6.0.3
      - id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, yaml
          print('matrix=' + json.dumps(yaml.safe_load(open('build.yaml'))))
          PY
  build:
    needs: matrix
    runs-on: ubuntu-24.04
    # Zephyr 3.5 image, pinned to the linux/amd64 manifest.
    container: zmkfirmware/zmk-build-arm:3.5@sha256:ba4e851529ac9a5cf6b02e7dd3297b78bd1b0e75546b9f1bb22023437836373e
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Initialize dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nano35/config
          cp config/west.lock.yml /tmp/nano35/config/west.yml
          cd /tmp/nano35
          west init -l config
          west update --narrow --fetch-opt=--filter=tree:0
      - name: Check trackball C regression tests
        if: matrix.shield == 'nano35_right'
        shell: bash
        run: python3 scripts/test-motion.py --workspace /tmp/nano35
      - name: Check OLED C regression tests
        if: matrix.snippet == 'nano35-oled'
        shell: bash
        run: python3 scripts/test-display.py --workspace /tmp/nano35
      - name: Check timed pointer acceleration and modes with UBSan
        if: matrix.snippet == 'nano35-oled'
        shell: bash
        run: python3 scripts/test-trackball-modes.py --workspace /tmp/nano35 --host-cc gcc
      - name: Build selected UF2
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          SHIELD: ${{ matrix.shield }}
          SNIPPET: ${{ matrix.snippet }}
          EXTRA_ARGS: ${{ matrix.cmake-args }}
          ARTIFACT: ${{ matrix.artifact-name }}
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          set -euo pipefail
          cd /tmp/nano35
          args=()
          if [ -n "$SNIPPET" ]; then args+=(-S "$SNIPPET"); fi
          extra=()
          read -r -a extra <<< "$EXTRA_ARGS" || true
          west build -s zmk/app -d build -b "$BOARD" "${args[@]}" -- \
            -DZephyr_DIR=/tmp/nano35/zephyr/share/zephyr-package/cmake \
            -DZMK_CONFIG="$GITHUB_WORKSPACE/config" \
            -DZMK_EXTRA_MODULES="$GITHUB_WORKSPACE" \
            -DSHIELD="$SHIELD" "${extra[@]}"
          test -s build/zephyr/zmk.uf2
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp build/zephyr/zmk.uf2 "$GITHUB_WORKSPACE/artifacts/$ARTIFACT.uf2"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/*.uf2
          if-no-files-found: error
