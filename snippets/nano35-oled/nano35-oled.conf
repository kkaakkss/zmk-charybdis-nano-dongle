CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y
# Keep synchronous I2C/LVGL work off the USB/BLE system work queue.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
# SH1106 uses vertically tiled 1-bit pixels. A full frame is 1024 bytes.
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_Z_VDB_SIZE=100
# Extra headroom for the two timer labels and four progress objects.
CONFIG_LV_Z_MEM_POOL_SIZE=12288
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=20
# Blank only the display after five minutes without activity.
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
