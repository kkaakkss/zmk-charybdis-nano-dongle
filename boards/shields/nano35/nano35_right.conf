CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_SPI=y
CONFIG_PMW3610=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=1000
# This driver has no timer to flush a throttled final delta. A nonzero
# interval can lose short movements; forward each sensor sample instead.
CONFIG_PMW3610_REPORT_INTERVAL_MIN=0
CONFIG_INPUT_QUEUE_MAX_MSGS=64
# Keep paired X/Y notifications moving during a BLE connection event.
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_CONN_TX_MAX=8
CONFIG_BT_BUF_ACL_TX_COUNT=8
# Orientation from bdimitrako's Nano; verify on the physical sensor.
CONFIG_PMW3610_SWAP_XY=y
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_Y=y
