CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=5
# ZMK 0.3's split transport depends on ZMK_BLE. Reserve two split slots
# and three host profiles; USB remains the default HID output when connected.
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
# The same central queue carries keys and pointer axes. Leave room for a
# USB transfer to wait briefly without immediately dropping the next axis.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=64
CONFIG_INPUT_QUEUE_MAX_MSGS=64
